<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>律师工作台</title>
<style>
:root{--ink:#1c2733;--brand:#1f3a5f;--brand2:#2c5282;--gold:#b8860b;--bg:#f4f6f9;--card:#fff;--line:#e3e8ef;--muted:#6b7686;--red:#c0392b;--amber:#b7791f;--green:#2f855a;--blue:#2b6cb0}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",system-ui,-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--brand);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.logo{font-size:17px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
.hbtn:hover{background:rgba(255,255,255,.25)}
#caseSel{flex:0 1 340px;padding:5px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.94);color:var(--ink);font-size:13px;max-width:340px}
.spacer{flex:1}
nav{background:var(--card);border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:46px;z-index:40}
nav button{border:0;background:none;padding:12px 16px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
nav button.on{color:var(--brand);border-bottom-color:var(--gold);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:18px}
section{display:none}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
h2{margin:0 0 4px;font-size:17px;color:var(--brand)}
h3{margin:16px 0 8px;font-size:14.5px;color:var(--brand2)}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:10px;line-height:1.6}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;font-size:13px}
th{background:#eef2f7;color:var(--brand);white-space:nowrap}
td.wrap{word-break:break-all}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{border-color:var(--brand2);color:var(--brand2)}
.btn-p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-p:hover{background:var(--brand2);color:#fff}
.btn-d{color:var(--red);border-color:#eac8c4}
.btn-d:hover{background:#fdf1f0;border-color:var(--red);color:var(--red)}
.btn-s{padding:3px 8px;font-size:12px;border-radius:5px}
.badge{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;white-space:nowrap}
.b-red{background:#fdeceb;color:var(--red)}
.b-amber{background:#fdf3e3;color:var(--amber)}
.b-green{background:#e8f5ee;color:var(--green)}
.b-gray{background:#eef1f5;color:var(--muted)}
.b-blue{background:#e8f0fb;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.casecard{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;cursor:pointer}
.casecard:hover{border-color:var(--brand2);box-shadow:0 2px 8px rgba(31,58,95,.12)}
.casecard.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.casecard h4{margin:0 0 6px;font-size:15px;color:var(--brand)}
.kv{font-size:12.5px;color:var(--muted);margin:2px 0}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input.f,select.f,textarea.f{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
textarea.f{resize:vertical}
.empty{padding:36px;text-align:center;color:var(--muted);line-height:2}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 4px;border-bottom:1px dashed var(--line)}
.chk input[type=checkbox]{margin-top:3px}
.pill-count{font-size:12px;color:var(--muted)}
#overlay{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
#overlay.on{display:flex}
#modal{background:#fff;border-radius:12px;max-width:640px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#modal.wide{max-width:900px}
#modalHead{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;color:var(--brand);display:flex;justify-content:space-between;align-items:center;gap:10px}
#modalBody{padding:14px 18px;max-height:65vh;overflow:auto;line-height:1.7}
#modalFoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#2d3748;color:#fff;padding:9px 18px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:80vw}
#toast.on{opacity:1}
pre.preview{background:#f8f9fb;border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-wrap;font-family:"FangSong","仿宋","Microsoft YaHei",serif;font-size:14px;line-height:1.9;max-height:520px;overflow:auto;margin:0 0 10px}
.hint{background:#f2f7ff;border:1px solid #d4e3f8;color:#3a5a83;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.7}
.warnbox{background:#fdf6ec;border:1px solid #f0d9b5;color:#7a5b1e;border-radius:8px;padding:8px 12px;font-size:12.5px;margin:10px 0;line-height:1.7}
.filerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.mini{font-size:12px;color:var(--muted);line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.klist{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:#fff}
.klist table{border:0}
.klist th,.klist td{border-bottom:1px solid var(--line);border-left:0;border-right:0;border-top:0}
</style>
</head>
<body>
<header>
  <div class="logo">⚖ 律师工作台</div>
  <select id="caseSel" title="当前案件"></select>
  <button class="hbtn" id="btnNewCase">＋ 新建案件</button>
  <div class="spacer"></div>
  <button class="hbtn" id="btnHelp">使用指南</button>
</header>
<nav id="nav"></nav>
<main>
  <section id="tab-kanban"></section>
  <section id="tab-timeline"></section>
  <section id="tab-evidence"></section>
  <section id="tab-review"></section>
  <section id="tab-docs"></section>
  <section id="tab-desens"></section>
  <section id="tab-research"></section>
  <section id="tab-settings"></section>
</main>
<div id="overlay"><div id="modal"><div id="modalHead"><span id="modalTitle"></span><button class="btn btn-s" onclick="closeModal()">✕</button></div><div id="modalBody"></div><div id="modalFoot"></div></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= 基础工具 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowStr(){return today()+' '+new Date().toTimeString().slice(0,5)}
function uid(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}
function exportText(name,text,mime){download(new Blob(['\ufeff'+text],{type:mime||'text/plain;charset=utf-8'}),name)}
function exportCSV(name,rows){const q=v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};exportText(name,rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function exportDoc(name,title,bodyHtml){
 const html='<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'
 +'body{font-family:"仿宋","FangSong","宋体",serif;font-size:12pt;line-height:1.8}'
 +'h1{font-size:16pt;text-align:center;font-family:"黑体","SimHei",sans-serif}'
 +'h2{font-size:13pt;font-family:"黑体","SimHei",sans-serif}'
 +'table{border-collapse:collapse;width:100%}td,th{border:1px solid #555;padding:6px 8px;font-size:10.5pt;vertical-align:top;font-family:"宋体"}th{background:#eee}'
 +'.meta{color:#555;font-size:10pt;margin-bottom:10pt}.small{font-size:9pt;color:#666}p{margin:6pt 0}</style></head><body>'+bodyHtml+'</body></html>';
 download(new Blob(['\ufeff'+html],{type:'application/msword'}),name+'.doc')}
function copyText(t){if(!t){toast('没有可复制的内容');return}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('已复制'),()=>fallbackCopy(t))}
 else fallbackCopy(t)}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制')}catch(e){toast('复制失败，请手动选择文本')}ta.remove()}

/* ================= 数据层 ================= */
const LS='lawyerWorkbench.v1';
let DB;try{DB=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!DB||typeof DB!=='object'||!Array.isArray(DB.cases))DB={cases:[],settings:{model:'glm-4.6'},cur:null,seq:1};
if(!DB.settings)DB.settings={model:'glm-4.6'};
function save(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){toast('保存失败：浏览器存储空间不足，请导出备份后清理旧案件')}}
function curCase(){return DB.cases.find(c=>c.id===DB.cur)||null}
function needCase(){if(!curCase()){toast('请先在页首选择或新建案件');return false}return true}
function noCase(){return '<div class="card"><div class="empty">请先在页首选择案件<br>（或点右上角「＋ 新建案件」）</div></div>'}

/* ================= 弹窗 ================= */
function modal(o){$('#modalTitle').textContent=o.title;$('#modalBody').innerHTML=o.body;
 $('#modal').classList.toggle('wide',!!o.wide);
 const ft=$('#modalFoot');ft.innerHTML='';
 const mk=(t,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=t;b.onclick=fn;ft.appendChild(b)};
 if(o.onOk)mk(o.okText||'保存','btn-p',async()=>{const r=await o.onOk();if(r!==false)closeModal()});
 mk('取消','',closeModal);
 $('#overlay').classList.add('on')}
function closeModal(){$('#overlay').classList.remove('on')}
$('#overlay').addEventListener('mousedown',e=>{if(e.target.id==='overlay')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const V=id=>{const el=document.getElementById('mod-'+id);return el?el.value.trim():''};
const fin=(id,label,val,ph)=>'<label class="f">'+label+'</label><input class="f" id="mod-'+id+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'">';
const fsel=(id,label,opts,val)=>'<label class="f">'+label+'</label><select class="f" id="mod-'+id+'">'+opts.map(o=>'<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
const ftxt=(id,label,val,ph,h)=>'<label class="f">'+label+'</label><textarea class="f" id="mod-'+id+'" style="min-height:'+(h||64)+'px" placeholder="'+esc(ph||'')+'">'+esc(val||'')+'</textarea>';

/* ================= 导航 ================= */
const TABS=[['kanban','案件看板'],['timeline','时间线整理'],['evidence','证据目录'],['review','合同审查'],['docs','文书生成'],['desens','文件脱敏'],['research','依据线索'],['settings','设置']];
let TAB='kanban';
function buildNav(){$('#nav').innerHTML=TABS.map(t=>'<button data-t="'+t[0]+'" class="'+(t[0]===TAB?'on':'')+'">'+t[1]+'</button>').join('')}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;TAB=b.dataset.t;buildNav();render()};
function renderCaseSel(){const s=$('#caseSel');s.innerHTML='<option value="">— 选择当前案件 —</option>'+DB.cases.map(c=>'<option value="'+c.id+'"'+(c.id===DB.cur?' selected':'')+'>'+esc(c.name)+'</option>').join('')}
$('#caseSel').onchange=e=>{DB.cur=e.target.value||null;save();render()};
$('#btnNewCase').onclick=()=>caseModal();
function render(){renderCaseSel();
 const R={kanban:rKanban,timeline:rTimeline,evidence:rEvidence,review:rReview,docs:rDocs,desens:rDesens,research:rResearch,settings:rSettings};
 (R[TAB]||function(){})();
 document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id==='tab-'+TAB))}

/* ================= 公共导出件 ================= */
function docMeta(c){return '<div class="meta">案件：'+esc(c.name)+'　案号：'+esc(c.number||'—')+'　我方立场：'+esc(c.role||'—')+'<br>导出时间：'+nowStr()+'　由「律师工作台」生成（工作初稿，供人工复核）</div>'}
function reviewFoot(){return '<h2>待核实事项与复核提示</h2><p class="small">1）「待核实」条目未经证据印证，不得作为已认定事实使用；2）请人工核对日期、金额、当事人名称、案号与原件、签章及空白待填项；3）本文件为工作初稿，不构成法律意见，正式对外使用前请由执业律师复核。</p>'}

/* ================= 案件看板 ================= */
function caseModal(c){const isNew=!c;c=c||{};
 modal({title:isNew?'新建案件':'编辑案件',body:
  fin('name','案件名称 *',c.name,'如：某某公司买卖合同纠纷')
  +fin('number','案号 / 内部编号',c.number)
  +fin('client','委托人 / 当事人',c.client)
  +fin('role','我方立场',c.role,'如：原告代理 / 乙方 / 被告')
  +fin('opponent','对方当事人',c.opponent)
  +fsel('status','状态',['进行中','已结案','暂缓'],c.status||'进行中')
  +ftxt('notes','备注',c.notes,'',50),
  onOk:()=>{const name=V('name');if(!name){toast('请填写案件名称');return false}
   if(isNew){const nc={id:uid('c'),name:name,number:V('number'),client:V('client'),role:V('role'),opponent:V('opponent'),status:V('status'),notes:V('notes'),createdAt:Date.now(),events:[],evidence:[],clauses:[],refs:[],checklist:{type:'通用',items:[]}};
    DB.cases.unshift(nc);DB.cur=nc.id}
   else Object.assign(c,{name:name,number:V('number'),client:V('client'),role:V('role'),opponent:V('opponent'),status:V('status'),notes:V('notes')});
   save();render();toast('已保存')}})}
function setCur(id){DB.cur=id;save();render();toast('当前案件：'+curCase().name)}
function delCase(id){const c=DB.cases.find(x=>x.id===id);
 modal({title:'删除案件',body:'<p>确定删除「'+esc(c.name)+'」？该案件的时间线、证据、标注、依据线索将一并删除，且不可恢复。</p><p class="mini">建议先在「设置」导出 JSON 备份。</p>',okText:'删除',onOk:()=>{DB.cases=DB.cases.filter(x=>x.id!==id);if(DB.cur===id)DB.cur=DB.cases.length?DB.cases[0].id:null;save();render();toast('已删除')}})}
function rKanban(){const el=$('#tab-kanban');
 if(!DB.cases.length){el.innerHTML='<div class="card"><h2>案件看板</h2><p class="sub">一个案件一个档案：时间线、证据、审查意见、依据线索都挂在案件之下，跨标签页共用。</p><div class="empty">还没有案件<br><br><button class="btn btn-p" onclick="caseModal()">＋ 新建第一个案件</button></div></div>';return}
 el.innerHTML='<div class="card"><div class="row"><div class="grow"><h2>案件看板</h2><div class="sub">共 '+DB.cases.length+' 个案件 · 点击卡片设为当前案件（页首可随时切换）</div></div><button class="btn btn-p" onclick="caseModal()">＋ 新建案件</button></div>'
 +'<div class="grid">'+DB.cases.map(c=>{
  const pend=c.events.filter(x=>!x.confirmed).length,gap=c.evidence.filter(x=>x.gap).length,todo=c.checklist.items.filter(i=>!i.done).length;
  return '<div class="casecard'+(c.id===DB.cur?' cur':'')+'" onclick="setCur(\''+c.id+'\')">'
  +'<h4>'+esc(c.name)+' '+(c.id===DB.cur?'<span class="badge b-blue">当前</span>':'')+'</h4>'
  +'<div class="kv">案号：'+esc(c.number||'—')+'</div>'
  +'<div class="kv">委托人：'+esc(c.client||'—')+' · 立场：'+esc(c.role||'—')+'</div>'
  +'<div class="kv">状态：<span class="badge '+(c.status==='已结案'?'b-gray':'b-green')+'">'+esc(c.status||'进行中')+'</span></div>'
  +'<div class="kv pill-count">时间线 '+c.events.length+'（待核实 '+pend+'）· 证据 '+c.evidence.length+'（有缺口 '+gap+'）<br>标注 '+c.clauses.length+' · 清单待办 '+todo+' · 依据 '+c.refs.length+'</div>'
  +'<div class="row" style="margin-top:8px" onclick="event.stopPropagation()">'
  +'<button class="btn btn-s" onclick="caseModal(DB.cases.find(x=>x.id===\''+c.id+'\'))">编辑</button> '
  +'<button class="btn btn-s btn-d" onclick="delCase(\''+c.id+'\')">删除</button></div></div>'}).join('')+'</div></div>'}
/* ================= 时间线整理 ================= */
function evModal(c,ev){const isNew=!ev;ev=ev||{};
 modal({title:isNew?'新增时间线事件':'编辑事件',body:
  fin('date','日期',ev.date,'YYYY-MM-DD')
  +fin('title','事件 *',ev.title,'发生了什么')
  +fin('source','来源材料',ev.source,'如：微信聊天记录 p12 / 《购销合同》第3条')
  +fsel('conf','状态',['已确认','待核实'],ev.confirmed===false?'待核实':'已确认')
  +ftxt('note','备注',ev.note,'',50),
  onOk:()=>{const t=V('title');if(!t){toast('请填写事件内容');return false}
   const o={date:V('date'),title:t,source:V('source'),confirmed:V('conf')==='已确认',note:V('note')};
   if(isNew)c.events.push(Object.assign({id:uid('e')},o));else Object.assign(ev,o);
   c.events.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));save();render()}})}
function tglEv(id){const c=curCase(),ev=c.events.find(x=>x.id===id);ev.confirmed=!ev.confirmed;save();render()}
function delEv(id){const c=curCase(),ev=c.events.find(x=>x.id===id);
 modal({title:'删除事件',body:'<p>删除事件「'+esc(ev.title)+'」？</p>',okText:'删除',onOk:()=>{c.events=c.events.filter(x=>x.id!==id);save();render()}})}
function tlRows(c){return c.events.map(ev=>[ev.date||'未填日期',ev.title,ev.source||'',ev.confirmed?'已确认':'待核实',ev.note||''])}
function tlExport(kind){const c=curCase();if(!c.events.length){toast('暂无事件');return}
 const head=['日期','事件','来源材料','状态','备注'],rows=tlRows(c);
 if(kind==='csv')return exportCSV(c.name+'-时间线-'+today(),[head].concat(rows));
 if(kind==='md'){exportText(c.name+'-时间线-'+today()+'.md','# 时间线：'+c.name+'\n\n| '+head.join(' | ')+' |\n|---|---|---|---|---|\n'+rows.map(r=>'| '+r.map(x=>String(x).replace(/\|/g,'\\|').replace(/\n/g,' ')).join(' | ')+' |').join('\n')+'\n');return}
 const pend=c.events.filter(x=>!x.confirmed).length;
 exportDoc(c.name+'-时间线-'+today(),'时间线：'+c.name,docMeta(c)+'<h1>时间线整理表</h1><table><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'
  +rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>'
  +'<p class="small">共 '+c.events.length+' 条，其中待核实 '+pend+' 条；待核实条目未经证据印证，不得作为已认定事实使用。</p>'+reviewFoot())}
function rTimeline(){const el=$('#tab-timeline'),c=curCase();
 if(!c){el.innerHTML=noCase();return}
 const pend=c.events.filter(x=>!x.confirmed).length;

function moveEvd(id,dir){const c=curCase(),i=c.evidence.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=c.evidence.length)return;

 +evdRows(c).map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>'}

 const head=['编号','证据名称','来源','证明目的','三性及备注','缺口与补证建议'],rows=evdRows(c),gap=c.evidence.filter(x=>x.gap).length;

  +'<div class="row" style="margin-top:10px"><button class="btn" onclick="docFromCase()">引用当前案件信息</button>'

function docData(){const T=TPLS[docTpl],f={};T.fields.forEach(fd=>{f[fd[0]]=(docVals[docTpl+'.'+fd[0]]||'').trim()});return f}

function docFromCase(){const c=curCase();if(!c){toast('请先选择案件');return}
 [['client',c.client],['to',c.opponent],['defendant',c.opponent],['re',c.name]].forEach(m=>{const el2=$('#mod-dv_'+m[0]);if(el2&&!el2.value.trim())el2.value=m[1]||''});
 docSync();$('#docPrev').textContent=docText();toast('已引用当前案件信息（仅填充空字段）')}

const PATS={
 id:['身份证号',/(?<!\d)[1-9]\d{5}(?:18|19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dXx](?!\d)/g],

function rDesens(){const el=$('#tab-desens');
 el.innerHTML='<div class="card"><h2>文件脱敏</h2><div class="sub">全程本机处理，文本不上传。固定产出两份：可外发的<b>脱敏文件</b> ＋ 可逆向回填的<b>映射表</b>（对外分享案例材料、提交培训素材等场景）。</div>'
  +'<div class="two"><div>'
  +'<label class="f">原文本</label><textarea class="f" id="dsIn" style="min-height:210px" placeholder="粘贴合同/案例材料文本，或点下方上传 .txt / .md"></textarea>'

  +'<label class="f">自定义敏感词（每行一个：公司名、人名、项目代号…）</label>'
  +'<textarea class="f" id="dsWords" style="min-height:56px" placeholder="例：某某科技有限公司&#10;张三"></textarea>'
  +'<div class="row" style="margin-top:10px"><button class="btn btn-p" onclick="desRun()">开始脱敏</button></div>'
  +'</div><div>'
  +'<label class="f">脱敏结果（可编辑）</label><textarea class="f" id="dsOut" style="min-height:210px"></textarea>'
  +'<div class="filerow"><button class="btn btn-s" onclick="dsCopy()">复制</button>'
  +'<button class="btn btn-s" onclick="dsDownTxt()">下载脱敏文件</button><button class="btn btn-s" onclick="dsDownDoc()">下载 .doc</button><button class="btn btn-s" onclick="dsDownMap()">下载映射表 CSV</button></div>'
  +'<label class="f">映射表（原文 ↔ 占位符）</label><div id="dsMap" class="klist" style="max-height:190px">'
  +(lastMap.length?mapTable():'<div class="mini" style="padding:8px">尚未生成</div>')+'</div>'
  +'<div class="warnbox">外发前请检查：映射表仅留在本机，勿随脱敏文件一起发出。</div>'
  +'</div></div>'
  +'<h3>逆向回填（把脱敏文本还原为原文）</h3>'
  +'<div class="two"><div><label class="f">脱敏文本</label><textarea class="f" id="dsBack" style="min-height:90px"></textarea></div>'
  +'<div><label class="f">映射表 CSV（留空则使用本次会话生成的映射）</label><textarea class="f" id="dsMapIn" style="min-height:90px" placeholder="占位符,原文,类别,出现次数"></textarea>'
  +'<div class="row" style="margin-top:8px"><button class="btn" onclick="dsRestore()">还原</button></div>'
  +'<textarea class="f" id="dsRest" style="min-height:70px;margin-top:8px" placeholder="还原结果"></textarea></div></div></div>'}
function mapTable(){return '<table><tr><th style="width:90px">占位符</th><th>原文</th><th style="width:76px">类别</th><th style="width:48px">次数</th></tr>'
 +lastMap.map(m=>'<tr><td>'+esc(m.ph)+'</td><td class="wrap">'+esc(m.orig)+'</td><td>'+esc(m.cat)+'</td><td>'+m.n+'</td></tr>').join('')+'</table>'}
function desRun(){const txt=$('#dsIn').value;
 if(!txt.trim()){toast('请先粘贴或上传文本');return}
 const words=$('#dsWords').value.split('\n').map(s=>s.trim()).filter(Boolean);
 const map=new Map(),per={};
 const put=(cat,orig,n)=>{if(map.has(orig)){map.get(orig).n+=n;return map.get(orig).ph}
  per[cat]=(per[cat]||0)+1;const ph='['+cat+per[cat]+']';map.set(orig,{ph:ph,orig:orig,cat:cat,n:n});return ph};
 let out=txt;
 words.forEach(w=>{const parts=out.split(w);if(parts.length>1)out=parts.join(put('敏感词',w,parts.length-1))});
 [['id','dsId'],['ph','dsPh'],['em','dsEm'],['bk','dsBk'],['am','dsAm']].forEach(p=>{
  if($('#'+p[1]).checked)out=out.replace(PATS[p[0]][1],m=>put(PATS[p[0]][0],m,1))});
 lastMap=Array.from(map.values());
 $('#dsOut').value=out;
 $('#dsMap').innerHTML=lastMap.length?mapTable():'<div class="mini" style="padding:8px">未发现匹配项（可补充自定义敏感词）</div>';
 toast(lastMap.length?'已替换 '+lastMap.length+' 类敏感信息，请人工再核对一遍':'未发现匹配项')}
function dsClear(){$('#dsIn').value=''}
function dsFile(inp){const f=inp.files[0];if(!f)return;
 if(f.size>2*1024*1024){toast('文件过大（>2MB），请分段粘贴');inp.value='';return}
 const r=new FileReader();r.onload=()=>{$('#dsIn').value=String(r.result);toast('已读入：'+f.name)};r.readAsText(f,'utf-8');inp.value=''}
function dsCopy(){copyText($('#dsOut').value)}
function dsDownTxt(){const t=$('#dsOut').value;if(!t){toast('请先生成脱敏结果');return}exportText('脱敏文件-'+today()+'.txt',t)}
function dsDownDoc(){const t=$('#dsOut').value;if(!t){toast('请先生成脱敏结果');return}
 exportDoc('脱敏文件-'+today(),'脱敏文件','<div style="font-family:仿宋,宋体,serif;font-size:12pt;line-height:1.8">'+esc(t).replace(/\n/g,'<br>')+'</div><p class="small">本文件已脱敏：敏感信息以占位符替换，对应关系见内部映射表（勿随本文件外发）。</p>')}
function dsDownMap(){if(!lastMap.length){toast('暂无映射');return}
 exportCSV('脱敏映射表-'+today(),[['占位符','原文','类别','出现次数']].concat(lastMap.map(m=>[m.ph,m.orig,m.cat,m.n])))}
function parseCSV(t){const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else{if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}else if(ch==='\r'){}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}
 return rows.filter(r=>r.length&&!(r.length===1&&!r[0].trim()))}
function dsRestore(){let t=$('#dsBack').value;if(!t.trim()){toast('请粘贴脱敏文本');return}
 const raw=$('#dsMapIn').value.trim();let pairs=lastMap.map(m=>[m.ph,m.orig]);
 if(raw){const rows=parseCSV(raw);if(rows.length&&rows[0][0]==='占位符')rows.shift();
  pairs=rows.filter(r=>r.length>=2&&r[0]).map(r=>[r[0],r[1]])}
 if(!pairs.length){toast('没有可用映射（先生成映射或粘贴映射表 CSV）');return}
 let n=0;pairs.forEach(p=>{if(t.includes(p[0])){t=t.split(p[0]).join(p[1]);n++}});
 $('#dsRest').value=t;toast('已回填 '+n+' 类占位符，请人工复核还原结果')}

async function aiChat(sys,user,maxtok){const s=DB.settings,k=(s.apiKey||'');
 if(!k)throw new Error('未配置 API Key');
 const hd=new Headers();hd.append('Content-Type','application/json');hd.append('Authorization','Bearer '+k);
 const res=await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions',{method:'POST',
  headers:hd,
  body:JSON.stringify({model:s.model||'glm-4.6',messages:[{role:'system',content:sys},{role:'user',content:user}],temperature:0.3,max_tokens:maxtok||600})});
 if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' '+(t||'').slice(0,120))}
 const j=await res.json();const c2=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
 if(!c2)throw new Error('返回为空');return c2}
